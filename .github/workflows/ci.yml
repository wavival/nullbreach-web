name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Root install hydrates all npm workspaces (frontend + landing).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --reporter=default

      - name: Build
        env:
          # Mirror the production origin so the CI build represents what ships
          # (and stays consistent with netlify.toml connect-src / VITE_API_URL).
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://nullbreach-api.wavival.dev' }}
        run: npm run build

  landing:
    name: Landing · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build landing
        run: npm run build:landing

  backend:
    name: Backend · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Import order check (isort)
        run: isort --check-only .

      # Fail if a model change has no generated migration — would otherwise
      # pass CI and break the Railway `release: migrate` step on deploy.
      - name: Migrations up to date
        env:
          SECRET_KEY: ci-test-secret-key-not-used-in-prod
          DEBUG: "true"
        run: python manage.py makemigrations --check --dry-run

      # `manage.py test` sets _testing in settings: sqlite fallback, no
      # ANTHROPIC_API_KEY required. Only SECRET_KEY is needed to boot.
      - name: Test (coverage gate 80%)
        env:
          SECRET_KEY: ci-test-secret-key-not-used-in-prod
        run: |
          coverage run manage.py test tests
          coverage report
