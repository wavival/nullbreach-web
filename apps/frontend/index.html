<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://wavival.dev/nullbreach/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="preconnect"
      href="https://nullbreach-api.wavival.dev"
      crossorigin="anonymous"
    />

    <title>NullBreach: AI cybersecurity assistant</title>
    <meta
      name="description"
      content="NullBreach: AI-powered cybersecurity assistant. Chat about vulnerabilities, OWASP, threat modeling, and static source code analysis."
    />
    <!-- App shell behind login: noindex so it doesn't compete with the Astro
         landing for the /nullbreach/ canonical. The landing is the SEO entry. -->
    <meta name="robots" content="noindex, follow" />
    <meta name="author" content="Valentina Ramírez" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NullBreach" />
    <meta property="og:url" content="https://wavival.dev/nullbreach/" />
    <meta property="og:title" content="NullBreach: AI cybersecurity assistant" />
    <meta
      property="og:description"
      content="AI cybersecurity assistant. Vulnerabilities, OWASP, static code analysis."
    />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:image"
      content="https://wavival.dev/nullbreach/og.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NullBreach" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wavival.dev/nullbreach/" />
    <meta name="twitter:title" content="NullBreach: AI cybersecurity assistant" />
    <meta
      name="twitter:description"
      content="AI cybersecurity assistant. Vulnerabilities, OWASP, static code analysis."
    />
    <meta
      name="twitter:image"
      content="https://wavival.dev/nullbreach/og.jpg"
    />
    <meta name="twitter:image:alt" content="NullBreach" />
    <!-- No JSON-LD here: this app shell is noindex. The crawlable Astro landing
         (apps/landing) carries the SoftwareApplication + WebSite schema. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
